name: Build & Test

on:
  push:
    branches: [ '**' ]  # Run on any branch push
  pull_request:         # Run on any PR regardless of target branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        java-version: [ '25' ]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for git describe
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Validate pom.xml
      run: mvn -B validate

    - name: Compile
      run: mvn -B clean compile -DskipTests

    - name: Run tests
      run: mvn -B test

    - name: Build package
      run: mvn -B package -DskipTests

    - name: Archive root artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: maven-build-root-${{ matrix.java-version }}
        path: target/
        retention-days: 7

    - name: Archive privacy module artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: maven-build-privacy-${{ matrix.java-version }}
        path: privacy/target/
        retention-days: 7

    - name: Archive audit module artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: maven-build-audit-${{ matrix.java-version }}
        path: audit/target/
        retention-days: 7

    - name: Archive jdempotent module artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: maven-build-jdempotent-${{ matrix.java-version }}
        path: jdempotent/target/
        retention-days: 7

  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    strategy:
      matrix:
        java-version: [ '25' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # Compile + test with the JaCoCo agent so SpotBugs has classes to analyze
    # and jacoco.exec exists for the coverage report. A fresh checkout has neither.
    - name: Compile and run tests (coverage agent)
      run: mvn -B -Panalyze test

    - name: Run dependency check
      run: mvn -B -Panalyze dependency-check:check
      continue-on-error: true

    - name: Run checkstyle
      run: mvn -B -Panalyze checkstyle:check

    - name: Run SpotBugs
      run: mvn -B -Panalyze spotbugs:check
      continue-on-error: false

    - name: Generate JaCoCo report
      if: always()
      run: mvn -B -Panalyze jacoco:report

    - name: Upload JaCoCo report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report-${{ matrix.java-version }}
        path: '**/target/site/jacoco/'
        retention-days: 7

    - name: Upload SpotBugs report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spotbugs-report-${{ matrix.java-version }}
        path: |
          **/target/spotbugs*.xml
          **/target/spotbugsXml.xml
        retention-days: 7

    - name: Publish root security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report-root
        path: target/
        retention-days: 7

    - name: Publish privacy module security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report-privacy
        path: privacy/target/
        retention-days: 7

    - name: Publish audit module security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report-audit
        path: audit/target/
        retention-days: 7

    - name: Publish jdempotent module security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report-jdempotent
        path: jdempotent/target/
        retention-days: 7
