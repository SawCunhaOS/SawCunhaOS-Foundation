name: Publish Snapshot

on:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]

jobs:
  release:
    runs-on: ubuntu-latest
    # Só publica se o build passou e o branch é develop/fix/release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'develop' ||
       startsWith(github.event.workflow_run.head_branch, 'fix/') ||
       startsWith(github.event.workflow_run.head_branch, 'release/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # commit exato que disparou o build
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG key
        uses: ./.github/actions/setup-gpg
        with:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run deploy script
        run: bash scripts/deploy.sh
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Clean up GPG keyring on error
        if: failure()
        run: |
          gpg-connect-agent KILLAGENT /bye || true
          rm -rf ~/.gnupg || true
