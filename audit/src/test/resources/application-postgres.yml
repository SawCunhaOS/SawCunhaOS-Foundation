scos:
  audit:
    system: SCOS_AUDIT
    enabled: true
    performance:
      flush-interval-ms: 100      # responsive draining for tests (default 500 in prod)
      batch-size: 50
    durability:
      dlq-reprocess-interval-ms: 3600000   # disable DLQ reprocessing during tests
    liquibase:
      enabled: true
      contexts: test
      database-change-log-lock-table: IF_DATABASECHANGELOGLOCK
      database-change-log-table: IF_DATABASECHANGELOG
      change-log: classpath:db/changelog/db_audit.changelog-master.yaml
      default-schema: public

spring:
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    audit:
      url: jdbc:postgresql://localhost:5432/test
      username: test
      password: test
      hikari:
        connection-timeout: 5000
        idle-timeout: 150000
        max-lifetime: 300000
        minimum-idle: 10
        maximum-pool-size: 50
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
        ddl-auto: none
        dialect: org.hibernate.dialect.PostgreSQLDialect
        naming:
          implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
          physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        type:
          json_format_mapper: br.com.sawcunhaos.foundation.jpa.hibernate.JacksonCustomJsonFormatMapper
  aop:
    proxy-target-class: true
    auto: true
