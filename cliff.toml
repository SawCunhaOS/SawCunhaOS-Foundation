# git-cliff ~ configuração do changelog do SCOS Foundation
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
Todas as mudanças relevantes do SCOS Foundation, geradas automaticamente a partir
dos commits convencionais e agrupadas por módulo (scope).\n
"""
# Template Tera: agrupa por scope (módulo) e rotula cada item pelo tipo do commit.
body = """
{% if version %}\
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for scope, scoped_commits in commits | group_by(attribute="scope") %}
### {% if scope %}{{ scope }}{% else %}Outros{% endif %}
{% for commit in scoped_commits %}\
- {% if commit.breaking %}**⚠ Breaking Changes** · {% endif %}**{{ commit.group }}** — {{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\n
"""
footer = """
<!-- gerado automaticamente por git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
# Tags semânticas sem prefixo "v" (ex: 1.2.0), compatível com o histórico atual.
tag_pattern = '^\d+\.\d+\.\d+$'
topo_order = false
sort_commits = "oldest"

# Primeira regra que casa vence. Skips primeiro, depois tipos, depois fallback.
# default_scope = "Outros" garante que commits sem scope não sejam descartados
# pelo group_by(scope) do template e caiam na seção "Outros".
commit_parsers = [
  { message = '^chore\(ci\): update CHANGELOG', skip = true },
  { message = '^chore\(release\)', skip = true },
  { message = '^feat', group = "Features", default_scope = "Outros" },
  { message = '^fix', group = "Correções", default_scope = "Outros" },
  { message = '^docs', group = "Documentação", default_scope = "Outros" },
  { message = '^perf', group = "Performance", default_scope = "Outros" },
  { message = '^refactor', group = "Refatoração", default_scope = "Outros" },
  { message = '^test', group = "Testes", default_scope = "Outros" },
  { message = '^chore', group = "Manutenção", default_scope = "Outros" },
  { message = '^.*', group = "Diversos", default_scope = "Outros" },
]
