server:
  port: 8880

spring:
  cloud:
    compatibility-verifier:
      enabled: false
  main:
    allow-bean-definition-overriding: true
  cache:
    enable: false
  data:
    redis:
      # spring.data.redis.* connection info is no longer set here (Story 3.19 emenda): it used
      # to point at the docker-compose.yml fixed ports (6379/26379), a known flaky pattern
      # (deferred-work.md). PrimeNumbersJdempotentEnableITTest/DisableITTest now supply the real
      # host/port/sentinel.* via @DynamicPropertySource against dynamically-ported Testcontainers,
      # same pattern as RedisIdempotentRepositoryTopologySmokeITTest.
      repositories:
        enabled: false
scos:
  jdempotent:
    enabled: true
    # Story 3.10: obrigatório desde que DefaultKeyGenerator parou de ler System.getenv(APP_NAME)
    # silenciosamente. Sem esta propriedade, o contexto Spring falha a inicializar.
    namespace: jdempotent-it
    cache:
      redis:
        expirationTimeHour: 2
        dialTimeoutSecond: 3
        readTimeoutSecond: 3
        writeTimeoutSecond: 3
        maxRetryCount: 3
        persistReqRes: true
