# India PII patterns. Enabled via: scos.privacy.masking.builtins.enabled: [in]
pack: in
patterns:
  - name: aadhaar
    regex: '\b\d{4}\s?\d{4}\s?\d{4}\b'
    strategy: partial
    keep-first: 0
    keep-last: 4
  - name: pan
    regex: '\b[A-Z]{5}\d{4}[A-Z]\b'
    strategy: partial
    keep-first: 0
    keep-last: 2
